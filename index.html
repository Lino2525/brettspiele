<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Brettspiele</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/monopoly.css">
    <link rel="stylesheet" href="css/songquiz.css">
    <link rel="stylesheet" href="css/party.css">
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>
<main id="lobby" class="screen lobby">
    <div class="lobby-head"><h1>Brettspiele</h1><span class="music-slot"></span></div>
    <p class="sub">Zusammen spielen, egal wie weit weg.</p>

    <div class="name-row">
        <label class="field">Dein Name
            <input id="name" maxlength="20" autocomplete="off" placeholder="z. B. Anna">
        </label>
        <div class="avatar-pick">
            <button id="avatarBtn" class="avatar-btn" type="button" title="Avatar-Bild auswählen">
                <span id="avatarPlus">+</span>
                <img id="avatarPreview" alt="Dein Avatar" hidden>
            </button>
            <button id="avatarClear" class="link" type="button" hidden>entfernen</button>
            <input id="avatarFile" type="file" accept="image/*" hidden>
        </div>
    </div>
    <p class="hint-small">Avatar (optional): Er wird nur an deine Mitspielerin oder deinen Mitspieler geschickt und gelöscht, sobald du den Tab schließt.</p>

    <label class="field">Raumpasswort (optional)
        <input id="password" maxlength="40" autocomplete="off" placeholder="Beim Starten festlegen, beim Beitreten eingeben">
    </label>

    <p id="inviteNote" class="invite" hidden></p>

    <section class="card">
        <h2>Neues Spiel</h2>
        <div id="gameList" class="row"></div>
    </section>

    <section class="card">
        <h2>Raum beitreten</h2>
        <div class="row">
            <input id="code" maxlength="12" autocomplete="off" placeholder="Raumcode" class="code">
            <button id="joinBtn" class="btn" type="button">Beitreten</button>
        </div>
    </section>

    <section id="resumeCard" class="card" hidden>
        <h2>Unterbrochenes Spiel</h2>
        <div id="resumeList" class="row"></div>
    </section>

    <p id="lobbyMsg" class="msg"></p>
</main>

<div id="gameScreen" class="screen game" hidden>
    <header class="topbar">
        <span id="roomInfo" class="room"></span>
        <span id="status" class="status"></span>
        <span class="spacer"></span>
        <span class="music-slot"></span>
        <button id="copyLink" class="btn small" type="button">Einladungslink kopieren</button>
        <button id="leaveBtn" class="btn small" type="button">Verlassen</button>
    </header>
    <div id="gameRoot"></div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
