<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Brettspiele</title>
    <meta name="theme-color" content="#02040c">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/rummy.css">
    <link rel="stylesheet" href="css/monopoly.css">
    <link rel="stylesheet" href="css/songquiz.css">
    <link rel="stylesheet" href="css/party.css">
    <link rel="stylesheet" href="css/games.css">
    <link rel="stylesheet" href="css/sketch.css">
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>
<canvas id="nachtfeld" aria-hidden="true"></canvas>
<main id="lobby" class="screen lobby">
    <header class="lobby-head">
        <div>
            <h1>Brettspiele</h1>
            <p class="sub">Zusammen spielen, egal wie weit weg.</p>
        </div>
        <span class="music-slot"></span>
    </header>

    <section class="stage" aria-label="Spiel auswählen">
        <div id="stageSpace" class="stage-space" aria-hidden="true"></div>
        <div id="gameList" class="pills" role="radiogroup" aria-label="Spiel"></div>
    </section>

    <section class="dock" aria-labelledby="dockTitle">
        <div class="dock-game" aria-live="polite">
            <h2 id="dockTitle"></h2>
            <p id="dockText" class="dock-text"></p>
            <p id="dockMeta" class="dock-meta"></p>
        </div>

        <div class="dock-form">
            <label class="field">Dein Name
                <input id="name" maxlength="20" autocomplete="off" placeholder="z. B. Anna">
            </label>
            <div class="avatar-pick">
                <button id="avatarBtn" class="avatar-btn" type="button" title="Avatar-Bild auswählen" aria-label="Avatar-Bild auswählen">
                    <span id="avatarPlus"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="9" r="4"/><path d="M4.5 20c1.3-3.6 4.2-5.5 7.5-5.5s6.2 1.9 7.5 5.5"/></svg></span>
                    <img id="avatarPreview" alt="Dein Avatar" hidden>
                </button>
                <button id="avatarClear" class="link" type="button" hidden>entfernen</button>
                <input id="avatarFile" type="file" accept="image/*" hidden>
            </div>
            <button id="hostBtn" class="btn primary big" type="button">Spiel starten</button>
        </div>

        <details id="pwBox" class="pw">
            <summary>Raumpasswort</summary>
            <label class="field">Beim Starten festlegen, beim Beitreten eingeben
                <input id="password" maxlength="40" autocomplete="off" placeholder="optional">
            </label>
        </details>
        <p class="hint-small">Dein Avatar geht nur an die Leute in deinem Raum und ist weg, sobald du den Tab schließt.</p>
        <p class="netline"><button id="netBtn" class="link" type="button">Verbindung prüfen</button></p>
        <div id="netResult" class="netresult" role="status" hidden></div>

        <div class="dock-join">
            <label for="code" class="join-label">Schon eingeladen?</label>
            <input id="code" maxlength="12" autocomplete="off" placeholder="Raumcode" class="code">
            <button id="joinBtn" class="btn" type="button">Beitreten</button>
        </div>
        <p id="inviteNote" class="invite" hidden></p>
        <p id="lobbyMsg" class="msg" role="status"></p>
    </section>

    <section id="resumeCard" class="resume" hidden>
        <h2>Unterbrochene Spiele</h2>
        <div id="resumeList"></div>
    </section>
</main>

<div id="gameScreen" class="screen game" hidden>
    <header class="topbar">
        <span id="roomInfo" class="room"></span>
        <span id="linked" class="linked" hidden></span>
        <span id="status" class="status"></span>
        <span class="spacer"></span>
        <span class="music-slot"></span>
        <button id="copyLink" class="btn small" type="button"><span class="long">Einladungslink kopieren</span><span class="short">Link kopieren</span></button>
        <button id="leaveBtn" class="btn small ghost" type="button">Verlassen</button>
    </header>
    <div id="gameRoot"></div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
